spring.application.name=motiva
server.port=8080

# ---------------------------------------------------------------
# Conexão com o Oracle FIAP
# As credenciais vêm de VARIÁVEIS DE AMBIENTE (nunca do código):
#   ORACLE_USER     -> seu RM (ex.: RM000000)
#   ORACLE_PASSWORD -> sua senha do Oracle
#   ORACLE_URL      -> opcional; o padrão abaixo já aponta pro servidor da FIAP
# ---------------------------------------------------------------
spring.datasource.url=${ORACLE_URL:jdbc:oracle:thin:@oracle.fiap.com.br:1521:ORCL}
spring.datasource.username=${ORACLE_USER}
spring.datasource.password=${ORACLE_PASSWORD}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# Pool pequeno: o Oracle da FIAP limita sessões por aluno
spring.datasource.hikari.maximum-pool-size=3

# ---------------------------------------------------------------
# JPA / Hibernate
# ddl-auto=none: as tabelas são as da Sprint 3 (ajustadas pelo
# sql/migracao-sprint4.sql). O Hibernate NÃO cria nem altera tabelas.
# ---------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
